<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <linearGradient id="roundGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#fef3c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <g filter="url(#goldShadow)">
    <!-- Temple Wire Arms -->
    <path d="M 125 140 L 15 125 C 5 123 0 128 0 133 C 0 138 10 140 20 142 L 125 146 Z" fill="url(#goldMetallic)" />
    <path d="M 875 140 L 985 125 C 995 123 1000 128 1000 133 C 1000 138 990 140 980 142 L 875 146 Z" fill="url(#goldMetallic)" />

    <!-- Left Circle Lens & Wire Rim -->
    <circle cx="280" cy="180" r="145" fill="url(#roundGlint)" stroke="url(#goldMetallic)" stroke-width="9" />
    <circle cx="280" cy="180" r="139" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.5" />

    <!-- Right Circle Lens & Wire Rim -->
    <circle cx="720" cy="180" r="145" fill="url(#roundGlint)" stroke="url(#goldMetallic)" stroke-width="9" />
    <circle cx="720" cy="180" r="139" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.5" />

    <!-- Arched Wire Bridge -->
    <path d="M 425 160 Q 500 125 575 160" fill="none" stroke="url(#goldMetallic)" stroke-width="8" stroke-linecap="round" />
    <path d="M 427 162 Q 500 128 573 162" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Silicone Nose Pads -->
    <ellipse cx="445" cy="205" rx="5" ry="12" fill="#ffffff" opacity="0.65" stroke="#d97706" stroke-width="1" />
    <ellipse cx="555" cy="205" rx="5" ry="12" fill="#ffffff" opacity="0.65" stroke="#d97706" stroke-width="1" />
  </g>
</svg>
